name: Deploy GitHub Pages
on:
  push:
    branches: [main, codex/ppck-completion-20261102]
    paths-ignore: ['HANDOFF.md', 'README.md', 'tests/**']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate publish inputs
        run: |
          test -s 27233.mp4
          test -s admin.html
          test -s app-icon.png
          test -s vendor/mqtt.min.js
          node --check audience.mjs
          node --check presenter.mjs
          node --test tests/protocol.test.mjs
      - uses: actions/configure-pages@v5
      - name: Stage public files only
        run: |
          mkdir _site
          cp index.html admin.html style.css *.mjs 27233.mp4 first-frame.jpg app-icon.png audience-qr.png .nojekyll _site/
          cp -R vendor _site/vendor
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

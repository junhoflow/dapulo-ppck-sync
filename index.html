<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dapulo | PPCK Demo</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#174a76,#071629 75%);font:16px Arial,sans-serif;color:white;min-height:100vh;display:grid;place-items:center;padding:24px}.app{width:min(100%,1100px)}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}h1{font-size:26px;margin:0}.tag{font-size:12px;color:#9cdfe8}.screen{background:#000;border:1px solid #45627b;border-radius:18px;overflow:hidden;aspect-ratio:16/9;position:relative}video{width:100%;height:100%}.cover{position:absolute;inset:0;background:#071e36ec;display:grid;place-items:center;text-align:center;padding:20px}.cover[hidden],section[hidden]{display:none}.cover h2{font-size:clamp(22px,4vw,42px);margin:0 0 12px}.cover p{color:#bbd4e3}button{background:#88e0e7;color:#092338;border:0;border-radius:12px;padding:14px 19px;font-size:16px;font-weight:bold;cursor:pointer;margin:5px}.secondary{background:#25455f;color:white}.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:14px}.status{margin-left:auto;font-size:13px;color:#b5d0da}.hint{color:#a8bfd0;line-height:1.6;font-size:13px}section{margin-top:18px;border-top:1px solid #436178;padding-top:15px}#count{font-size:42px;font-weight:900}</style><main class="app"><header><h1>🐙 Dapulo <small style="font-size:13px;color:#a9cbdb">PPCK 2026 Demo</small></h1><span class="tag" id="conn">연결 중…</span></header><div class="screen" id="screen"><video id="video" src="27233.mp4" playsinline preload="auto"></video><div class="cover" id="cover"><div><h2>Let's create, focus, and grow.</h2><p id="message">영상 준비하기를 한 번 눌러주세요.</p><div id="count"></div><button id="ready">영상 준비하기</button></div></div></div><div class="row"><button class="secondary" id="full">전체 화면</button><button class="secondary" id="manual">직접 재생</button><span id="status" class="status">영상 대기 중</span></div><p class="hint">관객용 태블릿에서 미리 이 페이지를 열고 ‘영상 준비하기’를 눌러주세요. 브라우저에서 첫 터치가 필요할 수 있습니다. 발표 전에 모든 태블릿의 연결과 영상 로딩을 확인해주세요.</p><section id="presenter" hidden><h3>발표자 제어</h3><p class="hint">공개 실시간 중계 서버를 통해 태블릿에 제어 신호를 보냅니다. 네트워크 상태에 따라 지연될 수 있으니 발표 전 리허설이 필요합니다.</p><button id="start">3초 뒤 동시 재생</button><button id="pause" class="secondary">일시정지</button><button id="reset" class="secondary">처음으로</button><p class="hint" id="sent"></p></section></main><script src="https://unpkg.com/mqtt@5.10.4/dist/mqtt.min.js"></script><script>(()=>{const el=id=>document.getElementById(id),v=el('video'),cover=el('cover');let client,ready=false,timer;el('presenter').hidden=new URLSearchParams(location.search).get('presenter')!=='1';const status=s=>el('status').textContent=s;v.onerror=()=>{status('27233.mp4 영상 파일이 아직 없습니다');el('message').textContent='영상 파일 업로드가 필요합니다.'};v.oncanplay=()=>status('영상 로딩 완료');el('ready').onclick=async()=>{try{v.muted=true;await v.play();v.pause();v.currentTime=0;ready=true;el('message').textContent='준비 완료! 발표자가 재생할 때까지 기다려주세요.';el('ready').textContent='준비 완료';status('재생 준비 완료')}catch(e){status('재생 허용 실패: 직접 재생을 눌러주세요')}};el('manual').onclick=()=>{cover.hidden=true;v.muted=false;v.play().catch(()=>status('재생 허용이 필요합니다'))};el('full').onclick=()=>el('screen').requestFullscreen?.();function apply(m){clearInterval(timer);if(m.type==='pause'){v.pause();status('일시정지');return}if(m.type==='reset'){v.pause();v.currentTime=0;cover.hidden=false;el('count').textContent='';status('초기화');return}if(m.type==='play'){v.pause();v.currentTime=0;cover.hidden=false;timer=setInterval(()=>{let left=m.at-Date.now();if(left>0){el('count').textContent=(left/1000).toFixed(1)}else{clearInterval(timer);el('count').textContent='';cover.hidden=true;v.muted=!ready;v.play().then(()=>status('재생 중')).catch(()=>{cover.hidden=false;status('자동재생 차단: 직접 재생 필요')})}},40)}}function send(type){if(!client?.connected){el('sent').textContent='중계 연결 실패. 인터넷 연결을 확인하세요.';return}const m={type,at:Date.now()+3000};client.publish('dapulo/ppck/stage-6f2a49',JSON.stringify(m),{qos:1});apply(m);el('sent').textContent='신호 전송 완료: '+new Date().toLocaleTimeString()}el('start').onclick=()=>send('play');el('pause').onclick=()=>send('pause');el('reset').onclick=()=>send('reset');if(window.mqtt){client=mqtt.connect('wss://broker.emqx.io:8084/mqtt',{clientId:'dapulo_'+Math.random().toString(36).slice(2),reconnectPeriod:2500});client.on('connect',()=>{el('conn').textContent='● 실시간 연결됨';client.subscribe('dapulo/ppck/stage-6f2a49',{qos:1})});client.on('message',(t,p)=>{try{apply(JSON.parse(p.toString()))}catch(e){}});client.on('offline',()=>el('conn').textContent='재연결 중');client.on('error',()=>el('conn').textContent='연결 오류')}else{el('conn').textContent='중계 로딩 실패'}})();</script></html>
